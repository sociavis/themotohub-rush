<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>bike debug — plate calibration</title>
<style>
  body{margin:0;background:#1a1815;height:100vh;display:flex;font-family:monospace}
  #views{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  #views div{position:relative}
  #views span{position:absolute;top:6px;left:8px;color:#ed2f36;font:12px monospace;z-index:2}
  canvas{width:100%;height:100%;display:block}
  #panel{width:290px;background:#221f1b;color:#e8e2d8;padding:14px;overflow-y:auto;border-left:1px solid #3a342c}
  #panel h2{font-size:12px;color:#ed2f36;letter-spacing:0.1em;margin:0 0 10px}
  .plate{border:1px solid #3a342c;border-radius:4px;padding:10px;margin-bottom:12px}
  .plate h3{font-size:11px;margin:0 0 8px;color:#f0b090}
  label{display:block;font-size:10px;opacity:0.7;margin-top:6px}
  input[type=range]{width:100%}
  .val{float:right;color:#ed2f36}
  button{width:100%;margin-top:8px;padding:10px;background:#ed2f36;border:0;color:#fff;font:700 12px monospace;border-radius:3px;cursor:pointer}
  #out{width:100%;height:120px;background:#141210;color:#8f8;border:1px solid #3a342c;font-size:9px;margin-top:8px}
</style>
</head>
<body>
<div id="views">
  <div><span>LEFT SIDE</span><canvas id="c1"></canvas></div>
  <div><span>RIGHT SIDE</span><canvas id="c2"></canvas></div>
  <div><span>FRONT</span><canvas id="c3"></canvas></div>
  <div><span>REAR 3/4</span><canvas id="c4"></canvas></div>
</div>
<div id="panel">
  <h2>PLATE CALIBRATION</h2>
  <div id="controls"></div>
  <button id="copyBtn">COPY VALUES</button>
  <textarea id="out" readonly></textarea>
</div>
<script type="module">
import * as THREE from 'three';
import { loadGlbBike, setRiderNumber, tunePlate, getPlateSpots } from '/src/game/bike-glb.ts';
import { loadGlbRider, RIDER_TUNE } from '/src/game/rider-glb.ts';

const rig = await loadGlbBike();
if (!rig) { document.body.innerHTML = '<h1 style="color:red">GLB failed</h1>'; throw 0; }
setRiderNumber(parseInt(new URLSearchParams(location.search).get('num') || '739'));

// Rider mounted at the seat (same offsets as the game)
const rider = await loadGlbRider();
if (rider) {
  rider.root.position.set(0, 0.605, -0.235);
  rig.root.add(rider.root);
  rig.root.updateMatrixWorld(true);
  const lg = (n, o) => console.log('[mounts]', n, o ? o.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(2)).join(',') : 'NULL');
  lg('seat', rig.mounts.seat); lg('handL', rig.mounts.handL); lg('handR', rig.mounts.handR); lg('footL', rig.mounts.footL); lg('footR', rig.mounts.footR);
  rider.attach(rig.mounts);
  if (new URLSearchParams(location.search).has('nobike')) {
    rig.root.traverse(o => { if (o !== rider.root && !rider.root.getObjectById(o.id) && o.isMesh) o.visible = false; });
  }
  window.__rider = rider;  // console access for pose experiments
  const qp = new URLSearchParams(location.search);
  const pose = {
    crouch: parseFloat(qp.get('crouch') || '0'),
    back: parseFloat(qp.get('back') || '0'),
    legOut: parseFloat(qp.get('legout') || '0'),
    tuck: parseFloat(qp.get('tuck') || '0'),
    lean: parseFloat(qp.get('lean') || '0'),
  };
  rider.update(pose, 1);
}

// ── viewports (continuous render so texture edits show live) ──
const views = [
  { id: 'c1', pos: [-2.5, 0.6, -0.1], look: [0, 0.35, -0.1] },
  { id: 'c2', pos: [2.5, 0.6, -0.1], look: [0, 0.35, -0.1] },
  { id: 'c3', pos: [0, 0.6, 2.7], look: [0, 0.4, 0] },
  { id: 'c4', pos: [1.8, 0.9, -2.1], look: [0, 0.35, -0.1] },
];
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2622);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555044, 1.4));
const dl = new THREE.DirectionalLight(0xfff2e0, 2.2);
dl.position.set(2, 3, 2);
scene.add(dl);
scene.add(rig.root);

const renderers = views.map(v => {
  const cv = document.getElementById(v.id);
  const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  r.setSize(cv.clientWidth, cv.clientHeight, false);
  const cam = new THREE.PerspectiveCamera(35, cv.clientWidth / cv.clientHeight, 0.05, 40);
  cam.position.set(...v.pos);
  cam.lookAt(...v.look);
  return { r, cam };
});
let frames = 0;
(function loop() {
  requestAnimationFrame(loop);
  frames++;
  if (frames % 300 === 0) console.log('[loop] alive, frame', frames);
  for (const { r, cam } of renderers) r.render(scene, cam);
})();

// ── rider calibration ──
if (rider) {
  // defaults read from the LIVE mount so the first slider touch never jumps
  const RC = { height: 1.1, mountY: rider.root.position.y, mountZ: rider.root.position.z, footUp: RIDER_TUNE.footUp, footOut: RIDER_TUNE.footOut, handUp: RIDER_TUNE.handUp, handOut: RIDER_TUNE.handOut, legLen: 1, armLen: 1, footSize: 1 };
  const rdiv = document.createElement('div');
  rdiv.className = 'plate';
  rdiv.innerHTML = `<h3>RIDER FIT</h3>` + [
    ['height', 0.85, 1.35, 0.005],
    ['mountY', 0.15, 0.75, 0.005],
    ['mountZ', -0.35, 0.15, 0.005],
    ['footUp', -0.02, 0.16, 0.005],
    ['footOut', -0.08, 0.14, 0.005],
    ['handUp', -0.06, 0.12, 0.005],
    ['handOut', -0.08, 0.12, 0.005],
    ['legLen', 0.7, 1.3, 0.01],
    ['armLen', 0.7, 1.3, 0.01],
    ['footSize', 0.6, 1.4, 0.01],
  ].map(([k, mn, mx, st]) =>
    `<label>${k} <span class="val" id="rv_${k}">${RC[k].toFixed(3)}</span>
      <input type="range" id="rs_${k}" min="${mn}" max="${mx}" step="${st}" value="${RC[k]}"></label>`
  ).join('');
  document.getElementById('panel').insertBefore(rdiv, document.getElementById('controls'));
  const riderOut = document.createElement('textarea');
  riderOut.id = 'riderOut'; riderOut.readOnly = true;
  riderOut.style.cssText = 'width:100%;height:74px;background:#141210;color:#8f8;border:1px solid #3a342c;font-size:9px;margin-top:6px';
  rdiv.appendChild(riderOut);
  const updRiderOut = () => {
    riderOut.value = JSON.stringify({ height: +RC.height.toFixed(3), mountY: +RC.mountY.toFixed(3), mountZ: +RC.mountZ.toFixed(3), footUp: +RC.footUp.toFixed(3), footOut: +RC.footOut.toFixed(3), handUp: +RC.handUp.toFixed(3), handOut: +RC.handOut.toFixed(3), legLen: +RC.legLen.toFixed(2), armLen: +RC.armLen.toFixed(2), footSize: +RC.footSize.toFixed(2) });
  };
  updRiderOut();
  const applyRider = (k, v) => {
    RC[k] = v;
    if (k === 'height') rider.setHeight(v);
    else if (k === 'mountY' || k === 'mountZ') rider.root.position.set(0, RC.mountY, RC.mountZ);
    else if (k === 'legLen' || k === 'armLen' || k === 'footSize') rider.setBodyShape({ [k]: v });
    else { RIDER_TUNE[k] = v; }
    rider.update({ crouch: 0, back: 0, legOut: 0, tuck: 0, lean: 0 }, 1);
    document.getElementById('rv_' + k).textContent = v.toFixed(3);
    updRiderOut();
  };
  for (const k of Object.keys(RC)) {
    document.getElementById('rs_' + k).addEventListener('input', (e) => applyRider(k, parseFloat(e.target.value)));
  }
}

// ── controls ──
const NAMES = ['LEFT SIDE PLATE', 'RIGHT SIDE PLATE', 'FRONT PLATE'];
const spots = getPlateSpots();
const controls = document.getElementById('controls');
const out = document.getElementById('out');

function updateOut() {
  out.value = JSON.stringify(getPlateSpots().map(({cal, ...p}) => ({
    x: +p.x.toFixed(3), y: +p.y.toFixed(3),
    rot: +p.rot.toFixed(2), size: +p.size.toFixed(2), maxW: +p.maxW.toFixed(2),
  })), null, 1);
}

spots.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'plate';
  div.innerHTML = `<h3>${NAMES[i]}</h3>
    <label>rotation <span class="val" id="rv${i}">${(p.rot * 180 / Math.PI).toFixed(0)}°</span>
      <input type="range" id="rot${i}" min="-180" max="180" step="1" value="${p.rot * 180 / Math.PI}"></label>
    <label>size <span class="val" id="sv${i}">${p.size.toFixed(2)}</span>
      <input type="range" id="size${i}" min="0.05" max="0.35" step="0.005" value="${p.size}"></label>
    <label>x <span class="val" id="xv${i}">${p.x.toFixed(3)}</span>
      <input type="range" id="x${i}" min="${p.x - 0.1}" max="${p.x + 0.1}" step="0.002" value="${p.x}"></label>
    <label>y <span class="val" id="yv${i}">${p.y.toFixed(3)}</span>
      <input type="range" id="y${i}" min="${p.y - 0.1}" max="${p.y + 0.1}" step="0.002" value="${p.y}"></label>`;
  controls.appendChild(div);
  const bind = (id, key, fmt, conv) => {
    const el = document.getElementById(id + i);
    el.addEventListener('input', () => {
      const v = conv(parseFloat(el.value));
      tunePlate(i, { [key]: v });
      document.getElementById(id.replace(/^(.).*/, '$1') + 'v' + i).textContent = fmt(v);
      updateOut();
    });
  };
  bind('rot', 'rot', v => (v * 180 / Math.PI).toFixed(0) + '°', v => v * Math.PI / 180);
  bind('size', 'size', v => v.toFixed(2), v => v);
  bind('x', 'x', v => v.toFixed(3), v => v);
  bind('y', 'y', v => v.toFixed(3), v => v);
});
updateOut();

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(out.value);
  document.getElementById('copyBtn').textContent = 'COPIED ✓';
  setTimeout(() => document.getElementById('copyBtn').textContent = 'COPY VALUES', 1200);
});
</script>
</body>
</html>
