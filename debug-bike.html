<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>bike debug — plate calibration</title>
<style>
  body{margin:0;background:#1a1815;height:100vh;display:flex;font-family:monospace}
  #views{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  #views div{position:relative}
  #views span{position:absolute;top:6px;left:8px;color:#ed2f36;font:12px monospace;z-index:2}
  canvas{width:100%;height:100%;display:block}
  #panel{width:290px;background:#221f1b;color:#e8e2d8;padding:14px;overflow-y:auto;border-left:1px solid #3a342c}
  #panel h2{font-size:12px;color:#ed2f36;letter-spacing:0.1em;margin:0 0 10px}
  .plate{border:1px solid #3a342c;border-radius:4px;padding:10px;margin-bottom:12px}
  .plate h3{font-size:11px;margin:0 0 8px;color:#f0b090}
  label{display:block;font-size:10px;opacity:0.7;margin-top:6px}
  input[type=range]{width:100%}
  .val{float:right;color:#ed2f36}
  button{width:100%;margin-top:8px;padding:10px;background:#ed2f36;border:0;color:#fff;font:700 12px monospace;border-radius:3px;cursor:pointer}
  #out{width:100%;height:120px;background:#141210;color:#8f8;border:1px solid #3a342c;font-size:9px;margin-top:8px}
</style>
</head>
<body>
<div id="views">
  <div><span>LEFT SIDE</span><canvas id="c1"></canvas></div>
  <div><span>RIGHT SIDE</span><canvas id="c2"></canvas></div>
  <div><span>FRONT</span><canvas id="c3"></canvas></div>
  <div><span>REAR 3/4</span><canvas id="c4"></canvas></div>
</div>
<div id="panel">
  <h2>PLATE CALIBRATION</h2>
  <div id="controls"></div>
  <button id="copyBtn">COPY VALUES</button>
  <textarea id="out" readonly></textarea>
</div>
<script type="module">
import * as THREE from 'three';
import { loadGlbBike, setRiderNumber, tunePlate, getPlateSpots } from '/src/game/bike-glb.ts';

const rig = await loadGlbBike();
if (!rig) { document.body.innerHTML = '<h1 style="color:red">GLB failed</h1>'; throw 0; }
setRiderNumber(parseInt(new URLSearchParams(location.search).get('num') || '739'));

// ── viewports (continuous render so texture edits show live) ──
const views = [
  { id: 'c1', pos: [-1.9, 0.3, -0.35], look: [0, 0.12, -0.35] },
  { id: 'c2', pos: [1.9, 0.3, -0.35], look: [0, 0.12, -0.35] },
  { id: 'c3', pos: [0, 0.3, 2.0], look: [0, 0.15, 0] },
  { id: 'c4', pos: [1.4, 0.55, -1.5], look: [0, 0.12, -0.2] },
];
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2622);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555044, 1.4));
const dl = new THREE.DirectionalLight(0xfff2e0, 2.2);
dl.position.set(2, 3, 2);
scene.add(dl);
scene.add(rig.root);

const renderers = views.map(v => {
  const cv = document.getElementById(v.id);
  const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  r.setSize(cv.clientWidth, cv.clientHeight, false);
  const cam = new THREE.PerspectiveCamera(35, cv.clientWidth / cv.clientHeight, 0.05, 40);
  cam.position.set(...v.pos);
  cam.lookAt(...v.look);
  return { r, cam };
});
let frames = 0;
(function loop() {
  requestAnimationFrame(loop);
  frames++;
  if (frames % 300 === 0) console.log('[loop] alive, frame', frames);
  for (const { r, cam } of renderers) r.render(scene, cam);
})();

// ── controls ──
const NAMES = ['LEFT SIDE PLATE', 'RIGHT SIDE PLATE', 'FRONT PLATE'];
const spots = getPlateSpots();
const controls = document.getElementById('controls');
const out = document.getElementById('out');

function updateOut() {
  out.value = JSON.stringify(getPlateSpots().map(({cal, ...p}) => ({
    x: +p.x.toFixed(3), y: +p.y.toFixed(3),
    rot: +p.rot.toFixed(2), size: +p.size.toFixed(2), maxW: +p.maxW.toFixed(2),
  })), null, 1);
}

spots.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'plate';
  div.innerHTML = `<h3>${NAMES[i]}</h3>
    <label>rotation <span class="val" id="rv${i}">${(p.rot * 180 / Math.PI).toFixed(0)}°</span>
      <input type="range" id="rot${i}" min="-180" max="180" step="1" value="${p.rot * 180 / Math.PI}"></label>
    <label>size <span class="val" id="sv${i}">${p.size.toFixed(2)}</span>
      <input type="range" id="size${i}" min="0.05" max="0.35" step="0.005" value="${p.size}"></label>
    <label>x <span class="val" id="xv${i}">${p.x.toFixed(3)}</span>
      <input type="range" id="x${i}" min="${p.x - 0.1}" max="${p.x + 0.1}" step="0.002" value="${p.x}"></label>
    <label>y <span class="val" id="yv${i}">${p.y.toFixed(3)}</span>
      <input type="range" id="y${i}" min="${p.y - 0.1}" max="${p.y + 0.1}" step="0.002" value="${p.y}"></label>`;
  controls.appendChild(div);
  const bind = (id, key, fmt, conv) => {
    const el = document.getElementById(id + i);
    el.addEventListener('input', () => {
      const v = conv(parseFloat(el.value));
      tunePlate(i, { [key]: v });
      document.getElementById(id.replace(/^(.).*/, '$1') + 'v' + i).textContent = fmt(v);
      updateOut();
    });
  };
  bind('rot', 'rot', v => (v * 180 / Math.PI).toFixed(0) + '°', v => v * Math.PI / 180);
  bind('size', 'size', v => v.toFixed(2), v => v);
  bind('x', 'x', v => v.toFixed(3), v => v);
  bind('y', 'y', v => v.toFixed(3), v => v);
});
updateOut();

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(out.value);
  document.getElementById('copyBtn').textContent = 'COPIED ✓';
  setTimeout(() => document.getElementById('copyBtn').textContent = 'COPY VALUES', 1200);
});
</script>
</body>
</html>
